[project]
name = "ticketpilot"
version = "0.1.0"
description = "Local browser research for ALL TICKET and ThaiTicketMajor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "playwright==1.64.0",
    "pydantic-settings==2.16.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.12.23"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["browser: local Playwright browser integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
